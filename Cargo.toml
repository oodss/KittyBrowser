[package]
name = "kittybrowser"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/oodss/KittyBrowser"
readme = "README.md"
keywords = ["browser", "terminal", "kitty", "chrome", "agents"]
categories = ["command-line-utilities", "web-programming"]
authors = ["Gregory Raiz"]
description = "A fast web browser that runs in a terminal pane, drawn with the kitty graphics protocol"

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
libc = "0.2"
miniz_oxide = "0.8"
png = "0.18"
serde_json = "1"
tempfile = { version = "3", default-features = false }
unicode-width = "0.2"
zune-jpeg = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
