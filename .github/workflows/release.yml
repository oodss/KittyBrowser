name: Release

# Builds kb for macOS and Linux when a version tag is pushed (git tag v0.2.0
# && git push --tags), so people can install it without Rust. install.sh
# downloads from here. Run by hand, it only builds, to check the builds work.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only publish, which runs no build, can write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # The oldest runners, so the binaries need only an older glibc and
          # run on more distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Check release security rules
        run: sh tests/release-security.sh
      - name: Install Rust toolchain
        run: |
          rust_version="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test -n "$rust_version"
          echo "RUST_VERSION=$rust_version" >> "$GITHUB_ENV"
          rustup toolchain install "$rust_version" --profile minimal --no-self-update
          rustup target add --toolchain "$rust_version" ${{ matrix.target }}
      # No build cache: a release is built from nothing, so a cache written
      # by another workflow can't end up in it.
      - run: cargo "+$RUST_VERSION" build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=kb-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/kb README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Attest archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: kb-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kb-${{ matrix.target }}
          path: kb-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      # Pinned: it runs with write access to the repository.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: kb-*.tar.gz*
          generate_release_notes: true
